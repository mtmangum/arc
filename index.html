<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://austinrifleclub.org/wp-content/uploads/2024/05/Transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Austin Rifle Club — A non-profit, volunteer-run shooting sports club located in Manor, TX. Established 1894." />
    <title>Austin Rifle Club</title>
    <script>
      (function () {
        var stored = localStorage.getItem('arc-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--
      Netlify Identity invite/recovery links land on whatever URL the site's
      root points to (not necessarily /admin/), carrying a token in the URL
      hash. The widget only picks that up if it's loaded on the page the
      link lands on, so it needs to be here too, not just in public/admin.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/'
            })
          }
        })
        // Invite/recovery/confirmation links carry a token in the URL hash;
        // send the user to /admin/ afterward so they land on the CMS.
        if (/(confirmation_token|invite_token|recovery_token)=/.test(document.location.hash)) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/'
          })
        }
      }
    </script>
  </body>
</html>
